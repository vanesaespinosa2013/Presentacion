<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vanessa Espinosa . Jugadora</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#1b1b3a;--ink2:#262652;--yellow:#fdda24;--violet:#9a6bff;--mint:#5ee0a0;--pink:#ff6b8a;--paper:#f6f2ff;--muted:#b9b6d9;
--px:'Press Start 2P','Courier New',monospace;--body:'Nunito','Segoe UI',system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--ink);color:var(--paper);font-family:var(--body);font-size:16px;line-height:1.5;overflow:hidden;
background-image:linear-gradient(var(--ink2) 1px,transparent 1px),linear-gradient(90deg,var(--ink2) 1px,transparent 1px);background-size:24px 24px;animation:grid 12s linear infinite}
@keyframes grid{to{background-position:24px 24px}}
#app{height:100%;display:flex;flex-direction:column;max-width:760px;margin:0 auto;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
#hud{display:flex;align-items:center;gap:10px;padding:12px 16px;font-family:var(--px);font-size:9px;color:var(--yellow)}
#bar{flex:1;height:10px;background:var(--ink2);border:2px solid var(--paper)}
#fill{height:100%;width:0;background:var(--yellow);transition:width .4s steps(8)}
#mute{font-size:14px;background:none;border:0;cursor:pointer;color:var(--yellow)}
main{flex:1;overflow-y:auto;padding:8px 16px 16px;-webkit-overflow-scrolling:touch}
.screen{display:none}.screen.on{display:block;animation:in .35s steps(7) both}
@keyframes in{from{opacity:0;transform:translateX(var(--d,30px))}}
h1,h2{font-family:var(--px);line-height:1.5;color:var(--yellow)}
h1{font-size:clamp(16px,5.2vw,26px);margin-bottom:14px}
h2{font-size:clamp(12px,3.6vw,17px);margin-bottom:12px}
p{margin-bottom:12px}.sub{color:var(--muted)}.c{text-align:center}
.box{background:var(--ink);border:3px solid var(--paper);box-shadow:5px 5px 0 var(--violet);padding:14px;margin-bottom:18px}
.box.y{border-color:var(--yellow);box-shadow:5px 5px 0 var(--yellow)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.stat{border:3px solid var(--paper);padding:10px;background:var(--ink);cursor:pointer;text-align:left;color:var(--paper);font-family:var(--body);min-height:92px}
.stat b{display:block;font-family:var(--px);font-size:18px;color:var(--mint);margin-bottom:6px}
.stat span{font-size:13px;color:var(--muted)}
.stat.pop,.item.pop{animation:pop .35s}
@keyframes pop{40%{transform:scale(1.12) rotate(-2deg)}}
.btn{font-family:var(--px);font-size:11px;line-height:1.4;background:var(--yellow);color:var(--ink);border:3px solid var(--paper);padding:14px 16px;cursor:pointer;box-shadow:4px 4px 0 var(--violet);touch-action:manipulation}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--violet)}
.btn.alt{background:var(--paper)}.btn[disabled]{opacity:.4;cursor:default}
button:focus-visible{outline:3px solid var(--mint);outline-offset:3px}
.blink{animation:blink 1s steps(2) infinite}@keyframes blink{50%{opacity:.25}}
.sp{display:inline-block}.bob{animation:bob 1s steps(2) infinite}@keyframes bob{50%{transform:translateY(-6px)}}
.hero{display:flex;justify-content:center;margin:6px 0 18px;cursor:pointer;background:none;border:0}
.jump{animation:jump .5s ease-out}@keyframes jump{40%{transform:translateY(-40px) rotate(8deg)}}
.skill{margin-bottom:12px;font-size:14px}.skill i{display:block;height:14px;border:3px solid var(--paper);margin-top:4px;background:var(--ink2)}
.skill i u{display:block;height:100%;width:0;background:var(--mint);transition:width 1s steps(10)}
.path{position:relative;padding-top:64px;margin-bottom:16px}
.path::before{content:"";position:absolute;left:8%;right:8%;top:76px;border-top:4px dashed var(--violet)}
#av{position:absolute;top:0;left:calc(16.6% - 20px);transition:left .6s steps(10)}
.nodes{display:flex}.nodes button{flex:1;background:none;border:0;color:var(--paper);font-family:var(--px);font-size:9px;cursor:pointer;padding:0 2px}
.nodes button s{display:block;width:26px;height:26px;margin:0 auto 8px;background:var(--ink);border:4px solid var(--yellow);text-decoration:none}
.nodes button.on s{background:var(--yellow)}
.mis{width:100%;text-align:left;font-family:var(--body);color:var(--paper);cursor:pointer;position:relative}
.det{max-height:0;overflow:hidden;transition:max-height .5s}.mis.open .det{max-height:340px}
.stamp{position:absolute;right:10px;top:10px;font-family:var(--px);font-size:9px;color:var(--mint);border:3px solid var(--mint);padding:4px;transform:rotate(-8deg) scale(0);transition:transform .3s cubic-bezier(.3,2,.5,1)}
.mis.open .stamp{transform:rotate(-8deg) scale(1)}
.items{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.item{font-family:var(--body);font-weight:800;font-size:14px;text-align:left;color:var(--paper);background:var(--ink);border:3px solid var(--muted);padding:10px;cursor:pointer;min-height:56px}
.item.got{border-color:var(--mint);color:var(--mint)}.item.lock{border-style:dashed;color:var(--muted)}
.item.open{border-color:var(--yellow);color:var(--yellow);border-style:solid}
.slots{display:flex;gap:6px;margin-bottom:12px}.slots i{flex:1;height:12px;border:2px solid var(--paper)}.slots i.f{background:var(--mint)}
.req{width:100%;text-align:left;font-family:var(--body);font-weight:800;color:var(--paper);background:var(--ink);border:3px solid var(--muted);padding:12px;margin-bottom:10px;cursor:pointer;display:flex;gap:10px;align-items:flex-start}
.req i{font-style:normal;font-family:var(--px);flex:0 0 22px;color:var(--muted)}
.req small{display:block;font-weight:500;color:var(--muted);max-height:0;overflow:hidden;transition:max-height .4s}
.req.ok{border-color:var(--mint)}.req.ok i{color:var(--mint)}.req.ok small{max-height:90px;margin-top:4px}
.nav{display:flex;align-items:center;justify-content:space-between;padding:10px 16px 14px}
.nav button{touch-action:none;user-select:none;-webkit-user-select:none;font-family:var(--px);font-size:14px;width:52px;height:46px;background:var(--ink);color:var(--yellow);border:3px solid var(--paper);cursor:pointer}
.nav button[disabled]{opacity:.3}
#dots{display:flex;gap:10px;justify-content:center;padding:4px 0}
#dots button{width:16px;height:16px;border:2px solid var(--paper);background:var(--ink);padding:0;cursor:pointer}
#dots button.on{background:var(--yellow)}#dots button.done{background:var(--violet)}
#ground{position:relative;z-index:3;height:84px;flex:none;margin-top:4px;border-top:4px solid var(--violet);background:repeating-linear-gradient(90deg,var(--ink2) 0 16px,var(--ink) 16px 32px);user-select:none;-webkit-user-select:none;touch-action:manipulation}
#pl{position:absolute;left:0;bottom:12px;width:32px;height:40px;z-index:5;will-change:transform}
#pl span{position:absolute;inset:0}#pl .f2{visibility:hidden}
#pl.walking .f1{animation:fa .3s steps(1) infinite}#pl.walking .f2{animation:fb .3s steps(1) infinite}
@keyframes fa{50%{visibility:hidden}}@keyframes fb{50%{visibility:visible}}
.coin{position:absolute;bottom:62px;width:18px;height:18px;background:var(--yellow);border:3px solid var(--paper);border-radius:50%;animation:spin 1s steps(4) infinite}
@keyframes spin{50%{transform:scaleX(.3)}}
#door{position:absolute;right:6px;bottom:10px;font-size:34px;line-height:1;animation:blink 1.2s steps(2) infinite}
#back{position:absolute;left:6px;bottom:14px;font-family:var(--px);font-size:14px;color:var(--violet)}
.toast{position:fixed;top:56px;left:50%;margin-left:-60px;width:120px;text-align:center;font-family:var(--px);font-size:10px;color:var(--ink);background:var(--mint);border:3px solid var(--paper);padding:8px;z-index:9;animation:rise 1.3s forwards}
@keyframes rise{to{transform:translateY(-26px);opacity:0}}
.pt{position:fixed;width:8px;height:8px;pointer-events:none;z-index:9}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
#tr{position:absolute;bottom:62px;width:32px;height:32px;z-index:4;animation:bob 1s steps(2) infinite}
.say{position:absolute;left:8px;right:8px;bottom:122px;min-height:48px;z-index:6;pointer-events:none;background:var(--paper);color:var(--ink);border:3px solid var(--ink2);box-shadow:4px 4px 0 var(--violet);padding:8px;font-weight:800;font-size:14px;line-height:1.3}
.box a{color:var(--yellow);font-weight:800}#lvl{cursor:pointer}
#md{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(27,27,58,.94);animation:mdin .3s steps(4)}
@keyframes mdin{from{opacity:0}}
.mc{width:100%;max-width:420px;max-height:92vh;overflow:auto;text-align:center;background:var(--ink);border:4px solid var(--yellow);box-shadow:8px 8px 0 var(--violet);padding:20px 16px;animation:mpop .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes mpop{from{transform:scale(.3);opacity:0}}
.award-row{display:flex;align-items:center;justify-content:center;gap:14px;margin:0 auto}
.mtr{display:inline-block;animation:drop 1s cubic-bezier(.3,1.5,.5,1) .3s both,glow 1.4s steps(2) 1.3s infinite}
.award-photo{width:68px;height:88px;object-fit:cover;object-position:center 25%;border:3px solid var(--paper);box-shadow:4px 4px 0 var(--violet);transform:rotate(4deg);animation:drop 1s cubic-bezier(.3,1.5,.5,1) .3s both}
@keyframes drop{from{transform:translateY(-160px) scale(.3) rotate(-25deg);opacity:0}}
@keyframes glow{50%{filter:drop-shadow(0 0 12px #fdda24)}}
.mc h2{margin:10px 0 4px;animation:up .5s .9s both}.mc .th{font-family:var(--px);font-size:13px;color:var(--mint);margin-bottom:12px;animation:up .5s 1.1s both}
@keyframes up{from{transform:translateY(14px);opacity:0}}
.mg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0;animation:up .5s 1.3s both}
.mg div{border:3px solid var(--paper);padding:8px 4px}.mg b{display:block;font:13px var(--px);color:var(--mint);margin-bottom:4px}.mg span{font-size:12px;color:var(--muted)}
.mc .y{color:var(--yellow);font-weight:800}.mc a{color:var(--yellow);font-weight:800}

/* portada */
.ttl{text-align:center;font-size:clamp(20px,7.2vw,54px);line-height:1.15;margin:4px 0 6px;color:var(--paper);text-shadow:4px 4px 0 var(--violet);letter-spacing:0}
.ttl span{display:block}
.ttl .vs{display:inline-block;font-size:.72em;color:var(--yellow);text-shadow:3px 3px 0 var(--pink);transform:rotate(-8deg);margin:6px 0 10px}
.hero{display:flex;justify-content:center;margin:8px 0 16px;cursor:pointer}
.hero svg{display:block;max-width:100%;height:auto}
.nm{font-family:var(--px);font-size:clamp(11px,3.2vw,14px);color:var(--yellow);text-align:center;margin:0 0 14px;letter-spacing:.06em}
.cards3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:0 0 18px}
.cards3>button{font-family:var(--body);color:var(--paper);cursor:pointer;background:#12122b;border:2px solid #3a3a7a;padding:10px;text-align:left}
.cards3>button:hover{border-color:var(--yellow);transform:translateY(-2px)}
.cards3 i{display:block;font-style:normal;font-size:16px;line-height:1.2;margin-bottom:4px}
.cards3 small{display:block;font-family:var(--px);font-size:clamp(6px,1.5vw,8px);line-height:1.5;color:var(--mint);margin-bottom:4px}
.cards3 b{display:block;font-size:clamp(11px,2.4vw,13px);line-height:1.3;font-weight:800}
#go{font-size:clamp(11px,3vw,14px);letter-spacing:.12em;padding:14px 26px}
.mis.eta.open .det{max-height:900px}
.eta .stamp{top:auto;bottom:10px}

/* ficha */
#fcm{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(10,10,28,.88);animation:mdin .3s steps(4)}
.fc{position:relative;width:100%;max-width:560px;max-height:86vh;overflow:auto;text-align:left;background:#17172f;border:3px solid var(--paper);box-shadow:8px 8px 0 var(--violet);padding:20px 16px 16px;animation:mpop .45s cubic-bezier(.3,1.6,.5,1)}
.fctag{display:block;font:9px/1.5 var(--px);color:var(--yellow);margin:0 0 14px;padding-right:36px}
.fcx{position:absolute;top:10px;right:10px;width:32px;height:32px;background:#2a2a5c;border:2px solid #4a4a8a;color:var(--paper);font-size:14px;cursor:pointer}
.fcprofile{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.fcav{flex:none;background:#262652;border:2px solid #4a4a8a;padding:4px;line-height:0}
.fcav svg{width:48px;height:60px}
.fcname{font:clamp(11px,3vw,16px)/1.5 var(--px);color:var(--yellow);margin:0 0 6px}
.fcdegree{font-size:13px;font-weight:800;margin:0}
.fcg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.fcg>div{min-width:0;background:#0f0f24;border:2px solid #3a3a7a;border-top:5px solid var(--violet);padding:12px 8px;text-align:center}
.fcg .fm{border-top-color:var(--mint)}.fcg .fy{border-top-color:var(--yellow)}
.fcg i{display:block;font-style:normal;font-size:20px;line-height:1.2;margin-bottom:6px}
.fcg small{display:block;font:clamp(6px,1.7vw,9px)/1.5 var(--px);color:var(--yellow);margin-bottom:8px}
.fcg p{font-size:clamp(10px,2.5vw,13px);line-height:1.4;margin:0}
.chips{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.chips span{display:flex;align-items:center;justify-content:center;min-height:34px;font-size:clamp(9px,2.3vw,12px);font-weight:800;line-height:1.3;background:#34344a;border:1px solid #55556d;padding:5px 4px}
.btn.alt.fcb{background:#2a2a5c;color:var(--paper);border-color:#4a4a8a}
.fcactions{text-align:center;margin:14px 0 0}

</style>
</head>
<body>
<div id="app">
  <div id="hud"><span id="lvl">LV 0</span><div id="bar"><div id="fill"></div></div><span id="cc">🪙0/21</span><span id="xp">0 XP</span><button id="mute" aria-label="Sonido">🔊</button></div>
  <main id="stage"></main>
  <div id="dots"></div>
  <div id="ground"><span id="back"></span><span id="door">🚪</span><div id="pl"></div></div>
  <div class="nav"><button id="prev" aria-label="Caminar a la izquierda">◀</button><button id="jump" aria-label="Saltar">▲</button><button id="next" aria-label="Caminar a la derecha">▶</button></div>
</div>
<script>
const DATO_EXTRA_EN_MONEDAS=false; // pon false para que las monedas solo sumen al contador y a los XP
/* ====== EDITA AQUÍ lo personal (no está en tu hoja de vida) ====== */
const YO={
  nombre:"Vanessa Espinosa",
  meGusta:["Completa aquí un hobby (ej.: crear contenido audiovisual)","Completa aquí otro gusto (ej.: música, series, deporte)"],
  datoCurioso:"Completa aquí un dato que te haga única"
};
/* ================================================================= */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const RM=matchMedia("(prefers-reduced-motion:reduce)").matches;
let xp=0,mute=false,AC;const st={items:0};

/* sonido */
function beep(f=520,d=.08,t="square"){if(mute)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=t;o.frequency.value=f;g.gain.value=.05;o.connect(g);g.connect(AC.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);o.stop(AC.currentTime+d)}catch(e){}}
const jingle=()=>{[523,659,784,1046].forEach((f,i)=>setTimeout(()=>beep(f,.12),i*110));PL.hop()};
$("#mute").onclick=e=>{mute=!mute;e.target.textContent=mute?"🔇":"🔊"};

/* sprites pixel */
function sprite(m,c,px=8){let r="";m.forEach((row,y)=>[...row].forEach((k,x)=>{if(c[k])r+=`<rect x="${x}" y="${y}" width="1" height="1" fill="${c[k]}"/>`}));
return `<svg viewBox="0 0 ${m[0].length} ${m.length}" width="${m[0].length*px}" height="${m.length*px}" shape-rendering="crispEdges" aria-hidden="true">${r}</svg>`}
const WOMAN=l=>["..HHHP..",".HHHHHH.","HHSSSSHH","HSeSSeSH","HHSSSSHH","H.BBBB.H","SBBBBBBS",".BBBBBB.","BBBBBBBB",l];
const WC={H:"#4a2c1a",S:"#f2c29b",e:"#1b1b3a",B:"#fdda24",L:"#f2c29b",P:"#ff6b8a"};
const HERO=sprite(WOMAN("..L..L.."),WC,8);
const HEROS=HERO.replace(/width="64" height="80"/,'width="40" height="50"');

/* efectos */
function tw(el,txt,sp=20){clearInterval(el._t);if(RM){el.textContent=txt;return}el.textContent="";let i=0;el._t=setInterval(()=>{el.textContent=txt.slice(0,++i);if(i>=txt.length)clearInterval(el._t)},sp)}
function burst(x,y,n=14){if(RM)return;const C=["#fdda24","#9a6bff","#5ee0a0","#f6f2ff"];for(let i=0;i<n;i++){const p=document.createElement("i");p.className="pt";p.style.cssText=`left:${x}px;top:${y}px;background:${C[i%4]}`;document.body.appendChild(p);const a=Math.random()*6.28,d=40+Math.random()*80;p.animate([{transform:"translate(0,0)",opacity:1},{transform:`translate(${Math.cos(a)*d}px,${Math.sin(a)*d+30}px) rotate(200deg)`,opacity:0}],{duration:750,easing:"ease-out"}).onfinish=()=>p.remove()}}
function confetti(){for(let k=0;k<7;k++)setTimeout(()=>burst(Math.random()*innerWidth,innerHeight*.25,20),k*170)}
function ctr(el){const r=el.getBoundingClientRect();return[r.left+r.width/2,r.top+r.height/2]}
function toast(t){const d=document.createElement("div");d.className="toast";d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),1300)}
function gain(n){xp+=n;$("#xp").textContent=xp+" XP";toast("+"+n+" XP")}
function anim(el,c){el.classList.remove(c);void el.offsetWidth;el.classList.add(c)}

/* ficha de personaje */
function openFicha(){if($("#fcm"))return;const m=document.createElement("div");m.id="fcm";m.setAttribute("role","dialog");m.setAttribute("aria-modal","true");m.setAttribute("aria-labelledby","fctitle");
m.innerHTML=`<div class="fc"><button class="fcx" id="fcx" aria-label="Cerrar">✕</button>
<h2 class="fctag" id="fctitle">INFORMACIÓN DEL PERSONAJE</h2>
<div class="fcprofile"><div class="fcav">${HERO}</div><div><h3 class="fcname">${YO.nombre}</h3><p class="fcdegree">Ingeniería de Sistemas · ITM · 8.º semestre</p></div></div>
<div class="fcg">
<div class="fv"><i>🧩</i><small>QUIÉN SOY</small><p>Curiosa y creativa. Pasé de los medios audiovisuales al desarrollo de software; hoy estudio Ingeniería de Sistemas.</p></div>
<div class="fm"><i>🎧</i><small>QUÉ ME GUSTA</small><div class="chips"><span>🎵 Música</span><span>📺 Series</span><span>🎮 Juegos</span><span>⚽ Deportes</span><span>🧶 Crochet</span></div></div>
<div class="fy"><i>🔥</i><small>QUÉ ME MOTIVA</small><p>Aprender cosas nuevas y crear soluciones que le sirvan a alguien.</p></div>
</div>
<p class="fcactions"><button class="btn alt fcb" id="fcno">CERRAR</button></p></div>`;
document.body.appendChild(m);beep(660,.1);
const close=()=>{m.remove();document.removeEventListener("keydown",esc)},esc=ev=>{if(ev.key==="Escape")close()};
document.addEventListener("keydown",esc);
$("#fcx",m).onclick=close;$("#fcno",m).onclick=close;m.addEventListener("pointerdown",ev=>{if(ev.target===m)close()});
$("#fcx",m).focus()}
/* pantallas */
const S=[];
S.push({h:`<h1 class="ttl"><span>JUGADORA </span></h1>
<div class="hero" id="hero" role="img" aria-label="Vanessa, tu jugadora">${HERO.replace(/width="64" height="80"/,'width="88" height="110"')}</div>
<p class="nm">${YO.nombre}</p>
<p class="c" style="font-weight:800;font-size:14px;margin-bottom:6px">Ingeniería de Sistemas · ITM · 8.º semestre</p>
<p class="sub c" style="font-size:13px;margin-bottom:18px">Mi historia en 6 niveles y 21 monedas.</p>
<div class="cards3">
<button type="button" aria-label="Ver información del personaje: quién soy"><i>🧩</i><small>QUIÉN SOY</small><b>Curiosa y creativa</b></button>
<button type="button" aria-label="Ver información del personaje: qué me gusta"><i>🎧</i><small>QUÉ ME GUSTA</small><b>Juegos · música · deporte</b></button>
<button type="button" aria-label="Ver información del personaje: qué me motiva"><i>🔥</i><small>QUÉ ME MOTIVA</small><b>Que sirva a alguien</b></button></div>
<p class="c"><button class="btn blink" id="go">▶ PRESS START</button></p>`,
init(e){$("#go",e).onclick=()=>show(1);$$(".cards3 button",e).forEach(card=>card.onclick=openFicha);
$("#hero",e).onclick=ev=>{anim($("#hero",e),"jump");beep(520,.1)}}});
